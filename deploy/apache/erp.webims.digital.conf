<VirtualHost *:80>
    ServerName erp.webims.digital

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /websocket ws://127.0.0.1:8095/websocket retry=0
    ProxyPassReverse /websocket ws://127.0.0.1:8095/websocket

    ProxyPass / http://127.0.0.1:8094/ connectiontimeout=5 timeout=600
    ProxyPassReverse / http://127.0.0.1:8094/

    ErrorLog ${APACHE_LOG_DIR}/erp_odoo_error.log
    CustomLog ${APACHE_LOG_DIR}/erp_odoo_access.log combined
</VirtualHost>
